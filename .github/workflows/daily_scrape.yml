name: Zonaprop Hunter & Market Analytics Manual Dispatch

on:
  workflow_dispatch: # Ejecución manual opcional (la automatización principal corre en local en Windows a las 08:30 y 17:00 con push a GitHub)

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Zonaprop Hunter & Market Analytics (Publicaciones del día)
        run: |
          python scraper_main.py --no-browser

      - name: Commit and push updated dashboard & history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html output/ history.json
          git commit -m "chore(data): auto-update daily market opportunities & analytics [skip ci]" || echo "No changes to commit"
          git push
