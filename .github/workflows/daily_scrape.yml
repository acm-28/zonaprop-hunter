name: Daily Real Estate Scraper & Market Analytics

on:
  schedule:
    # Se ejecuta todos los días a las 08:30 AM hora Argentina (11:30 UTC)
    - cron: '30 11 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde el botón "Run workflow" en GitHub

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para hacer commit y push de las actualizaciones

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Zonaprop Hunter & Market Analytics
        run: |
          python main.py --no-browser

      - name: Commit and push updated dashboard & history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html output/ history.json
          git commit -m "chore(data): auto-update daily market opportunities & analytics [skip ci]" || echo "No changes to commit"
          git push
